# providers.yaml — provider chain Hermes. Ditaruh di ~/.hermes/providers.yaml
#
# ATURAN KREDENSIAL: api_key SELALU "${NAMA_ENV}" — nilainya hidup di
# ~/.hermes/.env (chmod 600), tidak pernah di file ini. Jalankan
#   python3 rotate_keys.py --env-only --providers ~/.hermes/providers.yaml
# untuk memindahkan key literal kalau kamu menambah provider manual.
#
# Field per provider:
#   name      : nama provider (dipakai injector & health_check)
#   base_url  : endpoint OpenAI-compatible (tanpa / di akhir)
#   api_key   : "${ENV_VAR}" atau literal (literal dipindah otomatis)
#   key_env   : (opsional) nama env var, kalau tidak mau default <NAME>_API_KEY
#   status    : ok | ok_via_proxy | blocked (informasi; tidak dipakai utk gate)
#   priority  : kecil = dicoba lebih dulu
#   default_model : model yang dipakai injector bila request tak menyebut model
#   fallback  : true = hanya dipakai kalau provider utama habis
#   models    : daftar model yang dipakai/diuji
#   proxy     : (opsional) HTTP proxy khusus provider ini, mis.
#               http://127.0.0.1:20130 — hanya provider ini yang lewat
#               proxy; provider lain tetap langsung. Mengalahkan --proxy
#               global milik injector.
#
# Default semua provider: jalur langsung, tanpa proxy. Kit tidak
# memasang proxy apa pun; field proxy hanya dipakai bila kamu set sendiri.

providers:
  - name: provider-1
    base_url: https://api.provider-kamu.com/v1
    api_key: "${TOKEN_API_KEY}"
    status: ok
    priority: 1
    fallback: false
    default_model: model-utama
    models:
      - model-utama
      - model-cadangan
